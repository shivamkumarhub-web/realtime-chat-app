version: '3.8'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: chatdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: "RealtimeChatSecretKeyForJwtTokenGenerationMustBeLongEnoughForHS256AlgorithmToWorkProperly"
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  pgdata: