spring:
  profiles:
    active: dev
  application:
    name: realtime-chat

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:chatdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: "RealtimeChatSecretKeyForJwtTokenGenerationMustBeLongEnoughForHS256AlgorithmToWorkProperly"
  expiration-ms: 86400000

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:chatdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

jwt:
  secret: ${JWT_SECRET:"RealtimeChatSecretKeyForJwtTokenGenerationMustBeLongEnoughForHS256AlgorithmToWorkProperly"}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}